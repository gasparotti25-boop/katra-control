<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KATRA SIE7E — Control de Entradas</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 15% 15%, rgba(255,0,90,.22), transparent 28%),
        radial-gradient(circle at 85% 20%, rgba(0,255,190,.16), transparent 28%),
        radial-gradient(circle at 50% 100%, rgba(170,0,255,.18), transparent 35%),
        #030303;
      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    .tarjeta {
      margin-top: 20px;
      padding: 28px 20px;
      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(20,20,20,.96),
          rgba(5,5,5,.90)
        );

      border: 1px solid rgba(255,255,255,.14);

      box-shadow:
        0 35px 100px rgba(0,0,0,.8),
        inset 0 0 60px rgba(255,255,255,.025);

      backdrop-filter: blur(20px);
    }

    .badge {
      display: flex;
      width: fit-content;
      margin: 0 auto 18px;

      align-items: center;

      padding: 7px 15px;
      border-radius: 100px;

      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);

      font-size: 11px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .punto {
      width: 7px;
      height: 7px;
      margin-right: 8px;

      border-radius: 50%;

      background: #00ffb3;
      box-shadow: 0 0 12px #00ffb3;
    }

    .logo {
      text-align: center;

      font-size: clamp(55px, 16vw, 80px);
      font-weight: 1000;
      letter-spacing: 7px;
      line-height: .82;

      text-shadow:
        0 0 12px rgba(255,255,255,.8),
        0 0 35px rgba(255,255,255,.2);
    }

    .edicion {
      text-align: center;
      margin-top: 12px;

      font-size: 25px;
      font-weight: 1000;
      letter-spacing: 10px;
    }

    .subtitulo {
      text-align: center;

      margin-top: 25px;
      margin-bottom: 20px;

      color: rgba(255,255,255,.65);

      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    #reader {
      width: 100%;
      overflow: hidden;

      border-radius: 20px;

      background: #000;

      border: 1px solid rgba(255,255,255,.15);
    }

    #reader video {
      border-radius: 18px;
    }

    .estado {
      margin-top: 20px;
      padding: 20px;

      min-height: 90px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      border-radius: 18px;

      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);

      font-size: 18px;
      font-weight: 1000;
    }

    .esperando {
      color: rgba(255,255,255,.55);
    }

    .valida {
      color: #00ffb3;

      background: rgba(0,255,179,.08);

      border-color: rgba(0,255,179,.35);

      box-shadow:
        0 0 35px rgba(0,255,179,.12);
    }

    .usada,
    .invalida,
    .error {
      color: #ff526d;

      background: rgba(255,50,80,.08);

      border-color: rgba(255,50,80,.35);

      box-shadow:
        0 0 35px rgba(255,50,80,.10);
    }

    .info {
      margin-top: 15px;

      text-align: center;

      color: rgba(255,255,255,.45);

      font-size: 11px;

      line-height: 1.5;
    }

    .boton {
      width: 100%;

      margin-top: 18px;

      padding: 16px;

      border: none;
      border-radius: 14px;

      background: white;
      color: black;

      font-size: 14px;
      font-weight: 1000;

      cursor: pointer;
    }

    .boton:active {
      transform: scale(.98);
    }

    .bloqueado {
      display: none;
    }

    .loader {
      display: inline-block;

      width: 18px;
      height: 18px;

      border: 3px solid rgba(255,255,255,.25);
      border-top-color: white;

      border-radius: 50%;

      animation: girar .7s linear infinite;

      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes girar {
      to {
        transform: rotate(360deg);
      }
    }

    @media(max-width:480px) {
      body {
        padding: 10px;
      }

      .tarjeta {
        padding: 25px 15px;
      }
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <div class="tarjeta">

      <div class="badge">
        <span class="punto"></span>
        CONTROL OFICIAL
      </div>

      <div class="logo">
        KATRA
      </div>

      <div class="edicion">
        SIE7E
      </div>

      <div class="subtitulo">
        CONTROL DE INGRESO · 21 NOVIEMBRE
      </div>

      <div id="reader"></div>

      <div
        id="estado"
        class="estado esperando"
      >
        📷 ESCANEÁ UNA ENTRADA
      </div>

      <div
        id="info"
        class="info"
      >
        Cada QR puede utilizarse una sola vez.
      </div>

      <button
        id="botonReanudar"
        class="boton bloqueado"
        onclick="reanudarLector()"
      >
        📷 ESCANEAR OTRA ENTRADA
      </button>

    </div>

  </div>


<script>

  /*
   * =====================================================
   * CONFIGURACIÓN
   * =====================================================
   */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbzg5uNzLEhkKjGSZnthsh9Izw-d_txoA3QcXq0ziVg1D8tMeQOTL4shOKfFJlIntMhe7w/exec";


  /*
   * =====================================================
   * VARIABLES
   * =====================================================
   */

  let lector = null;

  let procesando = false;


  /*
   * =====================================================
   * ELEMENTOS
   * =====================================================
   */

  const estado =
    document.getElementById("estado");

  const info =
    document.getElementById("info");

  const botonReanudar =
    document.getElementById("botonReanudar");


  /*
   * =====================================================
   * INICIAR LECTOR
   * =====================================================
   */

  function iniciarLector() {

    procesando = false;

    botonReanudar.classList.add(
      "bloqueado"
    );

    estado.className =
      "estado esperando";

    estado.innerHTML =
      "📷 ESCANEÁ UNA ENTRADA";

    info.textContent =
      "Cada QR puede utilizarse una sola vez.";


    lector =
      new Html5Qrcode("reader");


    lector.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1

      },

      onScanSuccess,

      onScanFailure

    ).catch(function(error) {

      console.error(
        "Error iniciando cámara:",
        error
      );

      estado.className =
        "estado error";

      estado.innerHTML =
        "❌ NO SE PUDO ACCEDER A LA CÁMARA";

      info.textContent =
        "Revisá los permisos de cámara del navegador.";

    });

  }


  /*
   * =====================================================
   * CUANDO LEE UN QR
   * =====================================================
   */

  function onScanSuccess(decodedText) {

    if (procesando) {
      return;
    }


    procesando = true;


    estado.className =
      "estado esperando";

    estado.innerHTML =
      '<span class="loader"></span> VALIDANDO ENTRADA...';


    /*
     * Detenemos temporalmente la cámara
     * para evitar múltiples lecturas del mismo QR.
     */

    detenerCamara();


    validarQR(decodedText);

  }


  /*
   * =====================================================
   * VALIDAR QR CONTRA APPS SCRIPT
   * =====================================================
   */

  function validarQR(codigo) {

    if (!API_URL ||
        API_URL.includes("PEGÁ_ACÁ")) {

      estado.className =
        "estado error";

      estado.innerHTML =
        "❌ FALTA CONFIGURAR LA URL";

      info.textContent =
        "Pegá la URL del Web App de Apps Script en API_URL.";

      botonReanudar.classList.remove(
        "bloqueado"
      );

      procesando = false;

      return;
    }


    /*
     * JSONP
     *
     * Esto evita problemas de CORS
     * entre GitHub Pages y Apps Script.
     */

    const callbackName =
      "katraCallback_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random() * 100000
      );


    const script =
      document.createElement("script");


    const url =
      API_URL
      +
      "?accion=validarQR"
      +
      "&codigo="
      +
      encodeURIComponent(codigo)
      +
      "&callback="
      +
      callbackName;


    window[callbackName] =
      function(respuesta) {

        try {

          procesarRespuesta(
            respuesta,
            codigo
          );

        } finally {

          delete window[
            callbackName
          ];

          if (script.parentNode) {
            script.parentNode.removeChild(
              script
            );
          }

        }

      };


    script.onerror =
      function() {

        delete window[
          callbackName
        ];

        if (script.parentNode) {
          script.parentNode.removeChild(
            script
          );
        }


        estado.className =
          "estado error";

        estado.innerHTML =
          "❌ ERROR DE CONEXIÓN";

        info.textContent =
          "No se pudo conectar con el sistema de KATRA.";

        botonReanudar.classList.remove(
          "bloqueado"
        );

        procesando = false;

      };


    script.src =
      url;


    document.body.appendChild(
      script
    );

  }


  /*
   * =====================================================
   * RESPUESTA DEL SERVIDOR
   * =====================================================
   */

  function procesarRespuesta(
    respuesta,
    codigo
  ) {

    console.log(
      "Respuesta Apps Script:",
      respuesta
    );


    if (!respuesta) {

      mostrarError(
        "RESPUESTA VACÍA DEL SERVIDOR"
      );

      return;
    }


    /*
     * ENTRADA VÁLIDA
     */

    if (respuesta.ok === true) {

      estado.className =
        "estado valida";

      estado.innerHTML =
        "🟢 ENTRADA VÁLIDA";


      info.innerHTML =
        "El QR fue validado correctamente.<br>" +
        "<strong>Esta entrada quedó marcada como USADA.</strong>";


      /*
       * No dejamos que se vuelva a escanear
       * automáticamente el mismo QR.
       */

      botonReanudar.classList.remove(
        "bloqueado"
      );


      return;

    }


    /*
     * ENTRADA YA UTILIZADA
     */

    const mensaje =
      String(
        respuesta.mensaje || ""
      ).toUpperCase();


    if (
      mensaje.includes("YA UTILIZADA") ||
      mensaje.includes("USADA")
    ) {

      estado.className =
        "estado usada";

      estado.innerHTML =
        "🔴 ENTRADA YA UTILIZADA";


      info.innerHTML =
        "Este QR ya fue utilizado anteriormente.";

      botonReanudar.classList.remove(
        "bloqueado"
      );

      return;

    }


    /*
     * QR INVÁLIDO
     */

    estado.className =
      "estado invalida";

    estado.innerHTML =
      "🔴 ENTRADA INVÁLIDA";


    info.textContent =
      respuesta.mensaje ||
      "El código QR no es válido.";


    botonReanudar.classList.remove(
      "bloqueado"
    );

  }


  /*
   * =====================================================
   * ERROR
   * =====================================================
   */

  function mostrarError(
    mensaje
  ) {

    estado.className =
      "estado error";

    estado.innerHTML =
      "❌ " +
      mensaje;

    botonReanudar.classList.remove(
      "bloqueado"
    );

    procesando = false;

  }


  /*
   * =====================================================
   * DETENER CÁMARA
   * =====================================================
   */

  function detenerCamara() {

    if (!lector) {
      return;
    }


    lector.stop()
      .then(function() {

        console.log(
          "Cámara detenida."
        );

      })
      .catch(function(error) {

        console.warn(
          "No se pudo detener la cámara:",
          error
        );

      });

  }


  /*
   * =====================================================
   * REANUDAR LECTOR
   * =====================================================
   */

  function reanudarLector() {

    if (lector) {

      lector.clear()
        .catch(function() {});

    }


    document
      .getElementById("reader")
      .innerHTML = "";


    iniciarLector();

  }


  /*
   * =====================================================
   * QR NO DETECTADO
   * =====================================================
   */

  function onScanFailure(error) {
    /*
     * No hacemos nada.
     *
     * html5-qrcode llama esta función
     * constantemente mientras busca un QR.
     */
  }


  /*
   * =====================================================
   * ARRANCAR
   * =====================================================
   */

  window.addEventListener(
    "load",
    iniciarLector
  );

</script>

</body>
</html>
