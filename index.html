<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KATRA 6 - Control de Entradas</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      text-align: center;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      padding: 25px 15px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 5px;
      letter-spacing: 2px;
    }

    .subtitulo {
      color: #aaa;
      margin-bottom: 25px;
    }

    input {
      width: 90%;
      padding: 15px;
      border-radius: 10px;
      border: none;
      font-size: 18px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    button {
      width: 90%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    #btnLogin {
      background: #fff;
      color: #000;
    }

    #btnOtra {
      background: #fff;
      color: #000;
      display: none;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #resultado {
      margin-top: 25px;
      padding: 20px;
      border-radius: 15px;
      font-size: 22px;
      font-weight: bold;
      min-height: 30px;
    }

    .valida {
      background: #0b6b35;
    }

    .usada,
    .invalida {
      background: #9b1c1c;
    }

    .validando {
      background: #444;
    }

    .oculto {
      display: none;
    }

    .info {
      margin-top: 10px;
      font-size: 16px;
      font-weight: normal;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>KATRA 6</h1>
  <div class="subtitulo">CONTROL DE ENTRADAS</div>

  <!-- LOGIN -->
  <div id="login">
    <input
      type="password"
      id="password"
      placeholder="Contraseña"
    >

    <button id="btnLogin" onclick="ingresar()">
      INGRESAR
    </button>
  </div>

  <!-- CONTROL -->
  <div id="control" class="oculto">

    <div id="reader"></div>

    <div id="resultado"></div>

    <button id="btnOtra" onclick="otraEntrada()">
      ESCANEAR OTRA ENTRADA
    </button>

  </div>

</div>

<script>

  /*
   * URL DE GOOGLE APPS SCRIPT
   */
  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzg5uNzLEhkKjGSZnthsh9Izw-d_txoA3QcXq0ziVg1D8tMeQOTL4shOKfFJlIntMhe7w/exec";


  /*
   * CONTRASEÑA DEL CONTROL
   */
  const PASSWORD = "KATRA2026";


  let scanner = null;
  let procesando = false;


  /*
   * LOGIN
   */
  function ingresar() {

    const password =
      document.getElementById("password").value;

    if (password !== PASSWORD) {

      alert("Contraseña incorrecta");
      return;

    }

    document.getElementById("login").classList.add("oculto");

    document.getElementById("control").classList.remove("oculto");

    iniciarScanner();

  }


  /*
   * INICIAR CÁMARA
   */
  function iniciarScanner() {

    procesando = false;

    document.getElementById("resultado").innerHTML = "";

    document.getElementById("resultado").className = "";

    document.getElementById("btnOtra").style.display = "none";


    scanner = new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,
        qrbox: {
          width: 280,
          height: 280
        }
      },

      (decodedText) => {

        procesarQR(decodedText);

      },

      (errorMessage) => {

        // Ignoramos errores normales de lectura

      }

    ).catch((error) => {

      mostrarResultado(
        "NO SE PUDO ABRIR LA CÁMARA",
        "invalida"
      );

      console.error(error);

    });

  }


  /*
   * CUANDO SE DETECTA UN QR
   */
  function procesarQR(codigo) {

    if (procesando) return;

    procesando = true;


    document.getElementById("resultado").className = "validando";

    document.getElementById("resultado").innerHTML =
      "VALIDANDO QR...";


    /*
     * Frenamos la cámara para evitar
     * leer el mismo QR varias veces.
     */
    if (scanner) {

      scanner.stop().catch(() => {});

    }


    validarEnAppsScript(codigo);

  }


  /*
   * CONSULTA A GOOGLE APPS SCRIPT
   *
   * Usamos JSONP porque GitHub Pages
   * y Apps Script están en dominios diferentes.
   */
  function validarEnAppsScript(codigo) {

    const callbackName =
      "katraQRCallback_" + Date.now();


    let script;


    window[callbackName] = function(respuesta) {

      delete window[callbackName];


      if (script && script.parentNode) {

        script.parentNode.removeChild(script);

      }


      if (respuesta && respuesta.ok) {

        mostrarResultado(

          "✓ ENTRADA VÁLIDA",

          "valida",

          respuesta

        );

      } else {

        mostrarResultado(

          "✕ " + (
            respuesta?.mensaje ||
            "QR INVÁLIDO"
          ),

          respuesta?.mensaje === "ENTRADA YA UTILIZADA"
            ? "usada"
            : "invalida",

          respuesta

        );

      }


      document.getElementById("btnOtra").style.display =
        "block";

    };


    script = document.createElement("script");


    script.src =
      APPS_SCRIPT_URL +
      "?accion=validarQR" +
      "&codigo=" +
      encodeURIComponent(codigo) +
      "&callback=" +
      encodeURIComponent(callbackName);


    script.onerror = function() {

      delete window[callbackName];


      if (script && script.parentNode) {

        script.parentNode.removeChild(script);

      }


      mostrarResultado(

        "ERROR DE CONEXIÓN",

        "invalida"

      );


      document.getElementById("btnOtra").style.display =
        "block";

    };


    document.body.appendChild(script);

  }


  /*
   * MOSTRAR RESULTADO
   */
  function mostrarResultado(mensaje, clase, datos) {

    const resultado =
      document.getElementById("resultado");


    resultado.className = clase;


    let html = mensaje;


    if (datos && datos.nombre) {

      html +=
        '<div class="info">' +
        datos.nombre +
        '</div>';

    }


    if (datos && datos.tipo) {

      html +=
        '<div class="info">' +
        "Tipo: " +
        datos.tipo +
        '</div>';

    }


    resultado.innerHTML = html;

  }


  /*
   * ESCANEAR OTRA ENTRADA
   */
  function otraEntrada() {

    document.getElementById("resultado").innerHTML = "";

    document.getElementById("resultado").className = "";

    document.getElementById("btnOtra").style.display =
      "none";


    iniciarScanner();

  }

</script>

</body>
</html>
