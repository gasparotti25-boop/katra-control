<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>KATRA 6 - Control</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      padding: 25px 15px;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .subtitulo {
      color: #aaa;
      margin-bottom: 25px;
    }

    input {
      width: 90%;
      box-sizing: border-box;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      margin-bottom: 15px;
    }

    button {
      width: 90%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }

    #btnLogin {
      background: white;
      color: black;
    }

    #btnOtra {
      background: white;
      color: black;
      display: none;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #resultado {
      margin-top: 20px;
      padding: 20px;
      border-radius: 15px;
      font-size: 22px;
      font-weight: bold;
      min-height: 30px;
    }

    .valida {
      background: #087f3f;
    }

    .usada {
      background: #a40000;
    }

    .invalida {
      background: #a40000;
    }

    .validando {
      background: #444;
    }

    .oculto {
      display: none;
    }

    .info {
      margin-top: 10px;
      font-size: 16px;
      font-weight: normal;
    }

  </style>

</head>

<body>

<div class="contenedor">

  <h1>KATRA 6</h1>

  <div class="subtitulo">
    CONTROL DE ENTRADAS
  </div>


  <!-- LOGIN -->

  <div id="login">

    <input
      type="password"
      id="password"
      placeholder="Contraseña"
    >

    <button
      id="btnLogin"
      onclick="ingresar()"
    >
      INGRESAR
    </button>

  </div>


  <!-- CONTROL -->

  <div
    id="control"
    class="oculto"
  >

    <div id="reader"></div>

    <div id="resultado"></div>

    <button
      id="btnOtra"
      onclick="otraEntrada()"
    >
      ESCANEAR OTRA ENTRADA
    </button>

  </div>

</div>


<script>


/*************************************************
 * CONFIGURACIÓN
 *************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzg5uNzLEhkKjGSZnthsh9Izw-d_txoA3QcXq0ziVg1D8tMeQOTL4shOKfFJlIntMhe7w/exec";


const PASSWORD = "KATRA2026";


let scanner = null;

let procesando = false;


/*************************************************
 * LOGIN
 *************************************************/

function ingresar() {

  const password =
    document.getElementById("password").value;


  if (password !== PASSWORD) {

    alert("Contraseña incorrecta");

    return;

  }


  document
    .getElementById("login")
    .classList
    .add("oculto");


  document
    .getElementById("control")
    .classList
    .remove("oculto");


  iniciarScanner();

}


/*************************************************
 * INICIAR ESCÁNER
 *************************************************/

function iniciarScanner() {

  procesando = false;


  document
    .getElementById("resultado")
    .className = "";


  document
    .getElementById("resultado")
    .innerHTML = "";


  document
    .getElementById("btnOtra")
    .style.display = "none";


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 280,
        height: 280
      }

    },

    function(codigo) {

      procesarQR(codigo);

    },

    function(error) {

      // errores normales del escaneo
    }

  ).catch(function(error) {

    mostrarResultado(
      "NO SE PUDO ABRIR LA CÁMARA",
      "invalida"
    );

    console.error(error);

  });

}


/*************************************************
 * QR DETECTADO
 *************************************************/

function procesarQR(codigo) {

  if (procesando) {
    return;
  }


  procesando = true;


  mostrarResultado(
    "VALIDANDO QR...",
    "validando"
  );


  /*
   * Paramos la cámara.
   */

  if (scanner) {

    scanner
      .stop()
      .catch(function() {});

  }


  /*
   * AHORA SÍ:
   * mandamos el código a Apps Script.
   */

  validarEnAppsScript(codigo);

}


/*************************************************
 * VALIDAR EN GOOGLE APPS SCRIPT
 *************************************************/

function validarEnAppsScript(codigo) {

  const callbackName =
    "katraQR_" + Date.now();


  let script = null;


  /*
   * Esta función recibe la respuesta
   * de Google Apps Script.
   */

  window[callbackName] =
    function(respuesta) {


      /*
       * Eliminamos callback.
       */

      delete window[callbackName];


      /*
       * Eliminamos script.
       */

      if (
        script &&
        script.parentNode
      ) {

        script.parentNode
          .removeChild(script);

      }


      console.log(
        "RESPUESTA APPS SCRIPT:",
        respuesta
      );


      /*
       * ENTRADA VÁLIDA
       */

      if (
        respuesta &&
        respuesta.ok === true
      ) {

        mostrarResultado(

          "✓ ENTRADA VÁLIDA",

          "valida",

          respuesta

        );

      }


      /*
       * ENTRADA YA UTILIZADA
       */

      else if (

        respuesta &&
        respuesta.mensaje ===
          "ENTRADA YA UTILIZADA"

      ) {

        mostrarResultado(

          "✕ ENTRADA YA UTILIZADA",

          "usada",

          respuesta

        );

      }


      /*
       * CUALQUIER OTRO ERROR
       */

      else {

        mostrarResultado(

          "✕ " +
          (
            respuesta?.mensaje ||
            "QR INVÁLIDO"
          ),

          "invalida",

          respuesta

        );

      }


      document
        .getElementById("btnOtra")
        .style.display = "block";

    };


  /*
   * Creamos la llamada JSONP.
   */

  script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?accion=validarQR" +
    "&codigo=" +
    encodeURIComponent(codigo) +
    "&callback=" +
    callbackName;


  console.log(
    "URL DE VALIDACIÓN:",
    script.src
  );


  /*
   * Si Apps Script no responde.
   */

  script.onerror =
    function() {


      delete window[callbackName];


      if (
        script &&
        script.parentNode
      ) {

        script.parentNode
          .removeChild(script);

      }


      mostrarResultado(
        "ERROR DE CONEXIÓN CON GOOGLE",
        "invalida"
      );


      document
        .getElementById("btnOtra")
        .style.display = "block";

    };


  document
    .body
    .appendChild(script);

}


/*************************************************
 * MOSTRAR RESULTADO
 *************************************************/

function mostrarResultado(
  mensaje,
  clase,
  datos
) {

  const resultado =
    document.getElementById(
      "resultado"
    );


  resultado.className = clase;


  let html = mensaje;


  if (
    datos &&
    datos.nombre
  ) {

    html +=
      '<div class="info">' +
      datos.nombre +
      '</div>';

  }


  if (
    datos &&
    datos.tipo
  ) {

    html +=
      '<div class="info">' +
      "Tipo: " +
      datos.tipo +
      '</div>';

  }


  resultado.innerHTML = html;

}


/*************************************************
 * ESCANEAR OTRA
 *************************************************/

function otraEntrada() {

  document
    .getElementById("resultado")
    .innerHTML = "";


  document
    .getElementById("resultado")
    .className = "";


  document
    .getElementById("btnOtra")
    .style.display = "none";


  iniciarScanner();

}


</script>

</body>
</html>
